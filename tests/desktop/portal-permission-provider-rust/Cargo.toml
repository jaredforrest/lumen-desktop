[package]
name = "lumen-portal-permission-provider-fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3"
libc = "0.2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[[bin]]
name = "lumen-portal-permission-protocol-fixture"
path = "src/bin/protocol.rs"
