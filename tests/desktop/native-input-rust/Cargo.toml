[package]
name = "lumen-native-input-fixtures"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
png = "0.17"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[[bin]]
name = "lumen-clipboard-native-fixture"
path = "src/bin/clipboard.rs"

[[bin]]
name = "lumen-clock-native-fixture"
path = "src/bin/clock.rs"
