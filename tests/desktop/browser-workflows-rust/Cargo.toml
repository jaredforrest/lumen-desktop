[package]
name = "lumen-browser-workflows-fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
libc = "0.2"
png = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
