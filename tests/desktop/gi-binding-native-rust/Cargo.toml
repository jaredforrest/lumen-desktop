[package]
name = "lumen-gi-binding-native-fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
pyo3 = { version = "0.26", features = ["auto-initialize"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", features = ["tokio"] }
