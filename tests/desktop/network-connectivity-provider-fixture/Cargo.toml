[package]
name = "lumen-network-connectivity-provider-fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
