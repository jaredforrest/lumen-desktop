[package]
name = "lumen-office-workflows"
version = "0.1.0"
edition = "2024"

[dependencies]
lumen-application-isolation = { path = "../application-isolation" }
base64 = "0.22"
libc = "0.2"
png = "0.17"
roxmltree = "0.20"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
wait-timeout = "0.2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[dev-dependencies]
tempfile = "3"
