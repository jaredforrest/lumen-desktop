[package]
name = "lumen-document-history"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
