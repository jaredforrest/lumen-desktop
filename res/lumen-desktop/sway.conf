# Lumen-inspired Sway foundation: quiet graphite and a soft blue accent.
# Installed declaratively by the shared desktop module.
gaps inner 0
gaps outer 0
font Interlude Variable Medium 10
title_align center
titlebar_padding 10 5
client.focused #7AA2D6 #303238 #F5F5F7 #7AA2D6 #7AA2D6
client.focused_inactive #42444B #292B30 #D1D1D6 #42444B #42444B
client.unfocused #36383E #25272C #A1A1AA #36383E #36383E
client.urgent #E6A16A #403127 #FFF4EB #E6A16A #E6A16A

# Preserve the client's negotiated decoration ownership. Forcing a normal
# border onto client-decorated dialogs stacks a second title bar above them.
for_window [all] floating enable, move position center

# Desktop-owned apps integrate traffic lights into their own toolbar.
for_window [app_id="org.quickshell" title="^(Files.*|System Settings|Calendar|Text Tools|Window Overview|Quick Look|File Info|Desktop Help|Session Options|Remote Desktop)$"] border pixel 0
