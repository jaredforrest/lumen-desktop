[package]
name = "lumen-notifications"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3"
png = "0.17"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "sync"] }

[[test]]
name = "process"
harness = false
