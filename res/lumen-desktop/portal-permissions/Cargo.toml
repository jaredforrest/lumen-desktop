[package]
name = "lumen-portal-permissions"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
