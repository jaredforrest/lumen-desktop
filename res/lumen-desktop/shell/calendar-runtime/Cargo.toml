[package]
name = "desktop-calendar-runtime"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "calendar-mirror-reader"
path = "src/main.rs"

[[bin]]
name = "desktop-calendar"
path = "src/bin/calendar.rs"
required-features = ["eds"]

[[bin]]
name = "desktop-google-calendar-sync"
path = "src/bin/google_sync.rs"
required-features = ["eds"]

[features]
default = ["color"]
color = []
eds = []

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
hex = "0.4"
icalendar = { version = "0.17", features = ["recurrence"] }
iso8601 = "0.6"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
pkg-config = "0.3"
