[package]
name = "lumen-file-surfaces"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lumen-files-rust-wip"
path = "src/bin/files.rs"

[[bin]]
name = "lumen-search-rust-wip"
path = "src/bin/search.rs"

[[bin]]
name = "lumen-owned-preview-rust-wip"
path = "src/bin/owned_preview.rs"

[dependencies]
chrono = "0.4"
getrandom = "0.4"
gio = "0.21"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
mime_guess = "2"
notify = "8.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
