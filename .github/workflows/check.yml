name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs --option abort-on-warn true
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command gitleaks git . --redact=100
      - run: |
          mkdir -p artifacts
          nix build .#shell --out-link artifacts/shell-package --option abort-on-warn true
          LUMEN_TEST_SHELL_LAUNCHER="$PWD/artifacts/shell-package/bin/lumen-desktop-shell" nix develop --command desktop-test-python tests/desktop/run_backend_tests.py --output artifacts/backends
      - run: |
          mkdir -p artifacts
          nix build .#compositor --out-link artifacts/compositor-effects --option abort-on-warn true
          nix build .#shell-runtime --out-link artifacts/shell-runtime --option abort-on-warn true
          nix build .#test-typography --out-link artifacts/typography-probe --option abort-on-warn true
          nix develop --command desktop-test-python tests/desktop/typography_corpus.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --probe "$PWD/artifacts/typography-probe/bin/typography-probe" --output artifacts/typography
          nix build .#compositor-basic --out-link artifacts/compositor --option abort-on-warn true
          nix develop --command desktop-test-python tests/desktop/live_appearance.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/live-appearance
          LUMEN_TEST_SHELL_LAUNCHER="$PWD/artifacts/shell-package/bin/lumen-desktop-shell" LUMEN_TEST_COMPOSITOR="$PWD/artifacts/compositor/bin/sway" nix develop --command desktop-test-python tests/desktop/window_layout_menu_qml.py
          nix develop --command desktop-test-python tests/desktop/window_overview_lifecycle.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/overview-lifecycle
          nix develop --command desktop-test-python tests/desktop/smoke_installed.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/shell
      - run: |
          nix build .#test-pointer --out-link artifacts/pointer --option abort-on-warn true
          nix build .#test-session-lock --out-link artifacts/session-lock --option abort-on-warn true
          nix build .#test-constraint-client --out-link artifacts/constraint-client --option abort-on-warn true
          nix build .#test-window-relationships --out-link artifacts/window-relationships-client --option abort-on-warn true
          for compositor in compositor compositor-effects; do
            compositor_flags=()
            if [[ "$compositor" == compositor-effects ]]; then compositor_flags=(--effects); fi
            nix develop --command desktop-test-python tests/desktop/group_membership_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --locker "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/group-membership-$compositor"
            nix develop --command desktop-test-python tests/desktop/group_selector_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --locker "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/group-selector-$compositor"
            nix develop --command desktop-test-python tests/desktop/window_groups_native.py --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --keyboard wtype --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --locker "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/window-groups-$compositor"
            nix develop --command desktop-test-python tests/desktop/widget_catalogue_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/widget-catalogue-$compositor"
            nix develop --command desktop-test-python tests/desktop/dialog_manager_lifetime.py --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --output "artifacts/dialog-manager-lifetime-$compositor"
            nix develop --command desktop-test-python tests/desktop/desktop_lifecycle_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/desktop-lifecycle-$compositor"
            nix develop --command desktop-test-python tests/desktop/window_relationships_input.py --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --keyboard wtype --output "artifacts/window-relationships-$compositor"
            nix develop --command desktop-test-python tests/desktop/owned_window_context_input.py --full-shell --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --output "artifacts/owned-window-context-$compositor"
          done
          nix develop --command desktop-test-python tests/desktop/widget_catalogue_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --theme light --output artifacts/widget-catalogue-light
          nix develop --command desktop-test-python tests/desktop/battery_provider.py --output artifacts/power-provider
          nix develop --command desktop-test-python tests/desktop/status_clock_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/status-clock
          nix develop --command desktop-test-python tests/desktop/input_settings_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/input-settings
          nix develop --command desktop-test-python tests/desktop/wallpaper_settings_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/wallpaper-settings
          nix develop --command desktop-test-python tests/desktop/screen_saver_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --lock "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output artifacts/screen-saver
          nix develop --command desktop-test-python tests/desktop/screen_saver_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --lock "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output artifacts/screen-saver-effects
          nix develop --command desktop-test-python tests/desktop/calendar_widget_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/calendar-widget
          nix develop --command desktop-test-python tests/desktop/calendar_widget_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/calendar-widget-effects
          nix develop --command desktop-test-python tests/desktop/widget_visibility_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/widget-visibility
          nix develop --command desktop-test-python tests/desktop/widget_visibility_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/widget-visibility-effects
          nix develop --command desktop-test-python tests/desktop/text_sizing_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/text-sizing
          nix develop --command desktop-test-python tests/desktop/portal_permissions_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/portal-permissions
          nix develop --command desktop-test-python tests/desktop/files_layout_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/files-layout
          nix develop --command desktop-test-python tests/desktop/edge_layouts_input.py --sway "$PWD/artifacts/compositor/bin/sway" --pointer "$PWD/artifacts/pointer/bin/wlrctl" --keyboard wtype --lock "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --quickshell "$PWD/artifacts/shell-runtime/bin/quickshell" --constraint-client "$PWD/artifacts/constraint-client/bin/lumen-test-constraint-client" --output artifacts/edge-layouts
          nix develop --command desktop-test-python tests/desktop/paired_layouts_input.py --sway "$PWD/artifacts/compositor/bin/sway" --pointer "$PWD/artifacts/pointer/bin/wlrctl" --keyboard wtype --constraint-client "$PWD/artifacts/constraint-client/bin/lumen-test-constraint-client" --output artifacts/paired-layouts
          nix develop --command desktop-test-python tests/desktop/paired_layouts_input.py --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer "$PWD/artifacts/pointer/bin/wlrctl" --keyboard wtype --constraint-client "$PWD/artifacts/constraint-client/bin/lumen-test-constraint-client" --effects --output artifacts/paired-layouts-effects
          nix develop --command desktop-test-python tests/desktop/paired_picker_qml.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/paired-picker
          nix develop --command desktop-test-python tests/desktop/notification_recovery_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/notification-recovery-basic
          nix develop --command desktop-test-python tests/desktop/notification_recovery_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --effects --output artifacts/notification-recovery-effects
          nix develop --command desktop-test-python tests/desktop/notification_lock_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --lock-client "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output artifacts/notification-lock-basic
          nix develop --command desktop-test-python tests/desktop/notification_lock_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --lock-client "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --effects --output artifacts/notification-lock-effects
          PATH="$PWD/artifacts/shell-package/bin:$PATH" nix develop --command desktop-test-python tests/desktop/desktop_native_drag_render.py --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/file-drag
          for mode in light dark; do
            for frame in off on; do
              nix develop --command desktop-test-python tests/desktop/surface_matrix.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --theme "$mode" --native-frame "$frame" --output "artifacts/surfaces-$mode-$frame"
            done
          done
          nix develop --command desktop-test-python tests/desktop/native_hot_corners.py --sway "$PWD/artifacts/compositor/bin/sway" --pointer "$PWD/artifacts/pointer/bin/wlrctl" --keyboard wtype --lock "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output artifacts/hot-corners
          nix develop --command desktop-test-python tests/desktop/window_frames_render.py --core-only --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/native-layouts
          PATH="$PWD/artifacts/shell-package/bin:$PATH" nix develop --command desktop-test-python tests/desktop/interaction_regression.py --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/interactions
          nix develop --command desktop-test-python tests/desktop/accessibility_protocol.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/accessibility --full-shell
          nix develop --command desktop-test-python tests/desktop/spaces_placement.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/spaces
          nix develop --command desktop-test-python tests/desktop/application_lifecycle_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/application-lifecycle
          nix develop --command desktop-test-python tests/desktop/session_end_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/session-end
          nix develop --command desktop-test-python tests/desktop/session_end_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --effects --output artifacts/session-end-effects
      - run: |
          nix build .#test-network-provider --out-link artifacts/network-provider --option abort-on-warn true
          nix develop --command desktop-test-python tests/desktop/network_locations_provider.py --provider "$PWD/artifacts/network-provider" | tee artifacts/network-provider.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-logs
          if-no-files-found: error
          path: |
            artifacts/backends
            artifacts/group-membership-*
            artifacts/group-selector-*
            artifacts/window-groups-*
            artifacts/dialog-manager-lifetime-*
            artifacts/desktop-lifecycle-*
            artifacts/widget-visibility-*
            artifacts/screen-saver*
            artifacts/calendar-widget*
            artifacts/input-settings
            artifacts/widget-catalogue-*
            artifacts/shell
            artifacts/interactions
            artifacts/native-layouts
            artifacts/accessibility
            artifacts/hot-corners
            artifacts/edge-layouts
            artifacts/paired-layouts
            artifacts/paired-layouts-effects
            artifacts/paired-picker
            artifacts/notification-recovery-*
            artifacts/notification-lock-*
            artifacts/file-drag
            artifacts/files-layout
            artifacts/surfaces-*
            artifacts/typography
            artifacts/live-appearance
            artifacts/spaces
            artifacts/power-provider
            artifacts/overview-lifecycle
            artifacts/window-relationships-*
            artifacts/owned-window-context-*
            artifacts/status-clock
            artifacts/portal-permissions
            artifacts/text-sizing
            artifacts/application-lifecycle
            artifacts/session-end*
            artifacts/network-provider.log
