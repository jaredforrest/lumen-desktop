name: Checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs --option abort-on-warn true
      - run: python3 tests/ci/test_prepare_software_effects.py
      - run: python3 tests/ci/test_run_native.py
      - run: python3 tests/ci/test_native_namespace_policy.py
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command gitleaks git . --redact=100
      - run: bash tests/ci/run-native.sh namespace_policy_prepare nix develop --command desktop-test-python tests/ci/native_namespace_policy.py prepare --output artifacts/native-namespace-policy
      - run: |
          mkdir -p artifacts
          nix build .#shell --out-link artifacts/shell-package --option abort-on-warn true
          LUMEN_TEST_SHELL_LAUNCHER="$PWD/artifacts/shell-package/bin/lumen-desktop-shell" bash tests/ci/run-native.sh run_backend_tests nix develop --command desktop-test-python tests/desktop/run_backend_tests.py --output artifacts/backends
          bash tests/ci/run-native.sh biometric_provider nix develop --command desktop-test-python tests/desktop/biometric_provider.py --output artifacts/biometric-provider
      - run: |
          mkdir -p artifacts
          nix build .#compositor --out-link artifacts/compositor-effects --option abort-on-warn true
          bash tests/ci/prepare-software-effects.sh artifacts/software-effects-kernel
          bash tests/ci/run-native.sh effects_software_render nix develop --command desktop-test-python tests/desktop/effects_software_render.py --sway "$PWD/artifacts/compositor-effects/bin/sway" --output artifacts/effects-software-render
          nix build .#shell-runtime --out-link artifacts/shell-runtime --option abort-on-warn true
          nix build .#test-typography --out-link artifacts/typography-probe --option abort-on-warn true
          bash tests/ci/run-native.sh typography_corpus nix develop --command desktop-test-python tests/desktop/typography_corpus.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --probe "$PWD/artifacts/typography-probe/bin/typography-probe" --output artifacts/typography
          nix build .#compositor-basic --out-link artifacts/compositor --option abort-on-warn true
          bash tests/ci/run-native.sh live_appearance nix develop --command desktop-test-python tests/desktop/live_appearance.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/live-appearance
          LUMEN_TEST_SHELL_LAUNCHER="$PWD/artifacts/shell-package/bin/lumen-desktop-shell" LUMEN_TEST_COMPOSITOR="$PWD/artifacts/compositor/bin/sway" bash tests/ci/run-native.sh window_layout_menu_qml nix develop --command desktop-test-python tests/desktop/window_layout_menu_qml.py
          bash tests/ci/run-native.sh window_overview_lifecycle nix develop --command desktop-test-python tests/desktop/window_overview_lifecycle.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/overview-lifecycle
          bash tests/ci/run-native.sh smoke_installed nix develop --command desktop-test-python tests/desktop/smoke_installed.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/shell
      - run: |
          nix build .#app-launcher --out-link artifacts/app-launcher --option abort-on-warn true
          nix build .#desktop-action --out-link artifacts/desktop-action --option abort-on-warn true
          nix build .#checks.x86_64-linux.shortcut-hints --out-link artifacts/shortcut-fixtures --option abort-on-warn true
          nix build .#test-pointer --out-link artifacts/pointer --option abort-on-warn true
          bash tests/ci/run-native.sh application_isolation_native nix develop --command desktop-test-python tests/desktop/application_isolation_native.py --output artifacts/application-isolation
          nix build .#test-capture-pipewire --out-link artifacts/capture-pipewire --option abort-on-warn true
          bash tests/ci/run-native.sh capture_protocol_input nix develop --command desktop-test-python tests/desktop/capture_protocol_input.py --pipewire "$PWD/artifacts/capture-pipewire/bin" --output artifacts/capture-protocol
          bash tests/ci/run-native.sh live_transparency_native nix develop --command desktop-test-python tests/desktop/live_transparency_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/live-transparency-basic
          bash tests/ci/run-native.sh live_transparency_native nix develop --command desktop-test-python tests/desktop/live_transparency_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --effects --output artifacts/live-transparency-effects
          nix build .#reader-command --out-link artifacts/reader-command-package --option abort-on-warn true
          nix build .#test-reader-command --out-link artifacts/reader-command-enabled-package --option abort-on-warn true
          bash tests/ci/run-native.sh reader_commands_provider nix develop --command desktop-test-python tests/desktop/reader_commands_provider.py --disabled "$PWD/artifacts/reader-command-package" --enabled "$PWD/artifacts/reader-command-enabled-package" --output artifacts/reader-command-provider
          nix build .#test-screen-reader --out-link artifacts/screen-reader-package --option abort-on-warn true
          nix build .#test-screen-reader-atspi --out-link artifacts/screen-reader-atspi-package --option abort-on-warn true
          nix build .#test-screen-reader-tools --out-link artifacts/screen-reader-tools-package --option abort-on-warn true
          nix build .#test-speech-dispatcher --out-link artifacts/speech-dispatcher-package --option abort-on-warn true
          nix build .#test-speech-source --out-link artifacts/speech-dispatcher-source --option abort-on-warn true
          bash tests/ci/run-native.sh screen_reader_transport nix develop --command desktop-test-python tests/desktop/screen_reader_transport.py --dispatcher "$PWD/artifacts/speech-dispatcher-package" --dispatcher-source "$PWD/artifacts/speech-dispatcher-source" --output artifacts/screen-reader-transport
          bash tests/ci/run-native.sh atspi_action_metadata nix develop --command desktop-test-python tests/desktop/atspi_action_metadata.py --atspi "$PWD/artifacts/screen-reader-atspi-package" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --output artifacts/screen-reader-action-metadata
          nix build .#test-session-lock --out-link artifacts/session-lock --option abort-on-warn true
          nix build .#test-constraint-client --out-link artifacts/constraint-client --option abort-on-warn true
          nix build .#test-window-relationships --out-link artifacts/window-relationships-client --option abort-on-warn true
          nix build .#test-physical-keyboard --out-link artifacts/physical-keyboard --option abort-on-warn true
          nix build .#test-xwayland-relationships --out-link artifacts/xwayland-relationships-client --option abort-on-warn true
          nix build .#test-xwayland-server --out-link artifacts/xwayland-server --option abort-on-warn true
          nix build .#test-clipboard-producer --out-link artifacts/clipboard-producer --option abort-on-warn true
          nix build .#clipboard-observer --out-link artifacts/clipboard-observer --option abort-on-warn true
          for compositor in compositor compositor-effects; do
            compositor_flags=()
            if [[ "$compositor" == compositor-effects ]]; then compositor_flags=(--effects); fi
            bash tests/ci/run-native.sh owned_preview_input nix develop --command desktop-test-python tests/desktop/owned_preview_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --output "artifacts/owned-preview-$compositor"
            bash tests/ci/run-native.sh preview_actions_input nix develop --command desktop-test-python tests/desktop/preview_actions_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/preview-actions-$compositor"
            bash tests/ci/run-native.sh files_history_input nix develop --command desktop-test-python tests/desktop/files_history_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/files-history-$compositor"
            bash tests/ci/run-native.sh batch_rename_input nix develop --command desktop-test-python tests/desktop/batch_rename_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/batch-rename-$compositor"
            bash tests/ci/run-native.sh trash_confirmation_input nix develop --command desktop-test-python tests/desktop/trash_confirmation_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/trash-confirmation-$compositor"
            bash tests/ci/run-native.sh files_selection_input nix develop --command desktop-test-python tests/desktop/files_selection_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --lock-client "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/files-selection-$compositor"
            bash tests/ci/run-native.sh installed_switcher_input nix develop --command desktop-test-python tests/desktop/installed_switcher_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --action "$PWD/artifacts/desktop-action/bin/lumen-desktop-action" --sway "$PWD/artifacts/$compositor/bin/sway" --output "artifacts/installed-switcher-$compositor"
            bash tests/ci/run-native.sh clipboard_native_input nix develop --command desktop-test-python tests/desktop/clipboard_native_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --producer "$PWD/artifacts/clipboard-producer/bin/lumen-test-clipboard-producer" --observer "$PWD/artifacts/clipboard-observer/bin/lumen-clipboard-observer" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/clipboard-native-$compositor"
            bash tests/ci/run-native.sh search_history_input nix develop --command desktop-test-python tests/desktop/search_history_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --app-launcher "$PWD/artifacts/app-launcher/bin/lumen-app-launcher" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/search-history-$compositor"
            bash tests/ci/run-native.sh screen_reader_input nix develop --command desktop-test-python tests/desktop/screen_reader_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --orca "$PWD/artifacts/screen-reader-package" --at-spi-prefix "$PWD/artifacts/screen-reader-atspi-package" --dispatcher "$PWD/artifacts/speech-dispatcher-package" --dispatcher-source "$PWD/artifacts/speech-dispatcher-source" --schema-compiler "$PWD/artifacts/screen-reader-tools-package/bin/glib-compile-schemas" --isolation-tool "$PWD/artifacts/screen-reader-tools-package/bin/unshare" --reader-command "$PWD/artifacts/reader-command-enabled-package/bin/lumen-reader-command" --lock-client "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/screen-reader-input-$compositor"
            bash tests/ci/run-native.sh capture_native_input nix develop --command desktop-test-python tests/desktop/capture_native_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --pipewire "$PWD/artifacts/capture-pipewire/bin" --at-spi-prefix "$PWD/artifacts/screen-reader-atspi-package" --output "artifacts/capture-native-$compositor"
            bash tests/ci/run-native.sh clock_native_input nix develop --command desktop-test-python tests/desktop/clock_native_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --at-spi-prefix "$PWD/artifacts/screen-reader-atspi-package" --output "artifacts/clock-native-$compositor"
            bash tests/ci/run-native.sh settings_search_input nix develop --command desktop-test-python tests/desktop/settings_search_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/settings-search-$compositor"
            bash tests/ci/run-native.sh search_native_input nix develop --command desktop-test-python tests/desktop/search_native_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/search-native-$compositor"
            bash tests/ci/run-native.sh group_membership_input nix develop --command desktop-test-python tests/desktop/group_membership_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --locker "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/group-membership-$compositor"
            bash tests/ci/run-native.sh group_selector_input nix develop --command desktop-test-python tests/desktop/group_selector_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --locker "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/group-selector-$compositor"
            bash tests/ci/run-native.sh window_groups_native nix develop --command desktop-test-python tests/desktop/window_groups_native.py "${compositor_flags[@]}" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --keyboard wtype --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --locker "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output "artifacts/window-groups-$compositor"
            bash tests/ci/run-native.sh widget_catalogue_input nix develop --command desktop-test-python tests/desktop/widget_catalogue_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/widget-catalogue-$compositor"
            bash tests/ci/run-native.sh dialog_manager_lifetime nix develop --command desktop-test-python tests/desktop/dialog_manager_lifetime.py "${compositor_flags[@]}" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --output "artifacts/dialog-manager-lifetime-$compositor"
            bash tests/ci/run-native.sh desktop_lifecycle_input nix develop --command desktop-test-python tests/desktop/desktop_lifecycle_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/desktop-lifecycle-$compositor"
            bash tests/ci/run-native.sh window_relationships_input nix develop --command desktop-test-python tests/desktop/window_relationships_input.py "${compositor_flags[@]}" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/window-relationships-client/bin/lumen-test-window-relationships" --keyboard wtype --output "artifacts/window-relationships-$compositor"
            bash tests/ci/run-native.sh xwayland_relationships_input nix develop --command desktop-test-python tests/desktop/xwayland_relationships_input.py "${compositor_flags[@]}" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/xwayland-relationships-client/bin/lumen-test-xwayland-relationships" --keyboard "$PWD/artifacts/physical-keyboard/bin/lumen-test-physical-keyboard" --xwayland "$PWD/artifacts/xwayland-server/bin/Xwayland" --output "artifacts/xwayland-relationships-$compositor"
            bash tests/ci/run-native.sh xwayland_relationships_input nix develop --command desktop-test-python tests/desktop/xwayland_relationships_input.py "${compositor_flags[@]}" --sway "$PWD/artifacts/$compositor/bin/sway" --client "$PWD/artifacts/xwayland-relationships-client/bin/lumen-test-xwayland-relationships" --keyboard "$PWD/artifacts/physical-keyboard/bin/lumen-test-physical-keyboard" --xwayland "$PWD/artifacts/xwayland-server/bin/Xwayland" --without-xres --output "artifacts/xwayland-no-xres-$compositor"
            bash tests/ci/run-native.sh owned_window_context_input nix develop --command desktop-test-python tests/desktop/owned_window_context_input.py "${compositor_flags[@]}" --full-shell --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --output "artifacts/owned-window-context-$compositor"
            bash tests/ci/run-native.sh menubar_input nix develop --command desktop-test-python tests/desktop/menubar_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/menubar-$compositor"
            bash tests/ci/run-native.sh menu_keyboard_input nix develop --command desktop-test-python tests/desktop/menu_keyboard_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output "artifacts/menu-keyboard-$compositor"
            bash tests/ci/run-native.sh shortcut_hints_input nix develop --command desktop-test-python tests/desktop/shortcut_hints_input.py "${compositor_flags[@]}" --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/$compositor/bin/sway" --fixtures "$PWD/artifacts/shortcut-fixtures" --output "artifacts/shortcut-hints-$compositor"
          done
          bash tests/ci/run-native.sh widget_catalogue_input nix develop --command desktop-test-python tests/desktop/widget_catalogue_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --theme light --output artifacts/widget-catalogue-light
          bash tests/ci/run-native.sh network_connectivity_provider nix develop --command desktop-test-python tests/desktop/network_connectivity_provider.py --output artifacts/network-connectivity-provider
          bash tests/ci/run-native.sh battery_provider nix develop --command desktop-test-python tests/desktop/battery_provider.py --output artifacts/power-provider
          bash tests/ci/run-native.sh status_clock_input nix develop --command desktop-test-python tests/desktop/status_clock_input.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/status-clock
          bash tests/ci/run-native.sh input_settings_native nix develop --command desktop-test-python tests/desktop/input_settings_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/input-settings
          bash tests/ci/run-native.sh wallpaper_settings_native nix develop --command desktop-test-python tests/desktop/wallpaper_settings_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/wallpaper-settings
          bash tests/ci/run-native.sh screen_saver_native nix develop --command desktop-test-python tests/desktop/screen_saver_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --lock "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output artifacts/screen-saver
          bash tests/ci/run-native.sh screen_saver_native nix develop --command desktop-test-python tests/desktop/screen_saver_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --lock "$PWD/artifacts/session-lock/bin/lumen-test-session-lock" --output artifacts/screen-saver-effects
          bash tests/ci/run-native.sh calendar_widget_native nix develop --command desktop-test-python tests/desktop/calendar_widget_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/calendar-widget
          bash tests/ci/run-native.sh calendar_widget_native nix develop --command desktop-test-python tests/desktop/calendar_widget_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/calendar-widget-effects
          bash tests/ci/run-native.sh widget_visibility_native nix develop --command desktop-test-python tests/desktop/widget_visibility_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/widget-visibility
          bash tests/ci/run-native.sh widget_visibility_native nix develop --command desktop-test-python tests/desktop/widget_visibility_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/widget-visibility-effects
          bash tests/ci/run-native.sh fullscreen_menu_native nix develop --command desktop-test-python tests/desktop/fullscreen_menu_native.py --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/fullscreen-menu
          bash tests/ci/run-native.sh fullscreen_menu_native nix develop --command desktop-test-python tests/desktop/fullscreen_menu_native.py --effects --launcher "$PWD/artifacts/shell-package/bin/lumen-desktop-shell" --sway "$PWD/artifacts/compositor-effects/bin/sway" --pointer-tool "$PWD/artifacts/pointer/bin/wlrctl" --output artifacts/fullscreen-menu-effects
