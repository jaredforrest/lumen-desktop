            artifacts/consumer-fit-*
            artifacts/preferred-zoom-*
            artifacts/mixed-output-scale-*
            artifacts/accessibility
            artifacts/screen-reader-input-*
            artifacts/screen-reader-transport
            artifacts/screen-reader-action-metadata
            artifacts/screen-reader-action-metadata-rust
            artifacts/screen-reader-closures
            artifacts/reader-command-provider
            artifacts/application-isolation
            artifacts/capture-protocol
            artifacts/capture-native-*
            artifacts/clock-native-*
            artifacts/settings-search-*
            artifacts/hot-corners
            artifacts/edge-layouts*
            artifacts/paired-layouts
            artifacts/paired-layouts-effects
            artifacts/paired-picker
            artifacts/notification-recovery-*
            artifacts/notification-lock-*
            artifacts/file-drag
            artifacts/files-layout
            artifacts/files-layout-effects
            artifacts/surfaces-*
            artifacts/typography
            artifacts/live-appearance
            artifacts/live-transparency-*
            artifacts/spaces
