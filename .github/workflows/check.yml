name: Checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs --option abort-on-warn true
      - run: nix develop --command nu tests/ci/test_prepare_software_effects.nu
      - run: nix develop --command nu tests/ci/test_run_native.nu
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command gitleaks git . --redact=100
      - run: nix develop --command nu tests/ci/run-native.nu namespace_policy_prepare -- lumen-native-namespace-policy prepare --output artifacts/native-namespace-policy
      - run: nix develop --command nu tests/ci/integration-smoke.nu
      - run: nix develop --command nu tests/desktop/image_markup_qml.nu
      - run: nix develop --command nu tests/desktop/typography_roles.nu
      - run: nix develop --command nu tests/desktop/test_typography_cases.nu
      - run: nix develop --command nu tests/desktop/owned_typography_qml.nu
      - run: nix develop --command nu tests/desktop/owned_utility_typography_qml.nu
      - run: nix develop --command nu tests/desktop/document_tabs_typography.nu
      - run: nix develop --command nu tests/desktop/overview_typography_qml.nu
      - run: nix develop --command nu tests/desktop/calendar_detail_typography_qml.nu
      - run: nix develop --command nu tests/desktop/shared_control_typography_qml.nu
      - run: nix develop --command nu tests/desktop/launcher_typography_qml.nu
      - run: nix develop --command nu tests/desktop/network_health_presentation.nu
      - run: nix develop --command nu tests/desktop/display_spaces_model.nu
      - run: nix develop --command nu tests/desktop/display_spaces_wire.nu
      - run: nix develop --command nu tests/desktop/owned_focus.nu
      - run: nix develop --command nu tests/desktop/minimized_window_model.nu
      - run: nix develop --command nu tests/desktop/screen_saver_queue.nu
      - run: nix develop --command nu tests/desktop/folder_stack_model.nu
      - run: nix develop --command nu tests/desktop/desktop_navigation_model.nu
      - run: nix develop --command nu tests/desktop/captured_directory_qml.nu
      - run: nix develop --command nu tests/desktop/files_listing_checkpoint.nu
      - run: nix develop --command nu tests/desktop/dock_calendar_corpus.nu
      - run: nix develop --command nu tests/desktop/switch_indicator_paint.nu
      - run: nix develop --command nu tests/desktop/semantic_state_paint.nu
      - run: nix develop --command nu tests/ci/integration-effects.nu
      - run: nix develop --command nu tests/ci/integration-native.nu
      - run: nix develop --command nu tests/ci/integration-network.nu
      - if: always()
        run: nix develop --command nu tests/ci/run-native.nu namespace_policy_cleanup -- lumen-native-namespace-policy cleanup --output artifacts/native-namespace-policy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-logs
          if-no-files-found: error
          path: |
            artifacts/native-command-logs
            artifacts/native-namespace-policy
            artifacts/calendar-toggle-contrast
            artifacts/owned-typography-qml
            artifacts/owned-focus-qml
            artifacts/owned-inactive-native-*
            artifacts/reduced-motion-*
            artifacts/live-overlay-appearance-*
            artifacts/semantic-state-*
            artifacts/focus-expiry-presentation
            artifacts/switch-indicator-paint
            artifacts/owned-utility-typography
            artifacts/owned-utility-native-*
            artifacts/shared-control-typography
            artifacts/shared-control-native-*
            artifacts/calendar-detail-typography
            artifacts/calendar-detail-native-*
            artifacts/launcher-typography
            artifacts/document-tabs-typography
            artifacts/overview-typography
            artifacts/overview-typography-native-*
            artifacts/desktop-typography-native-*
            artifacts/launcher-typography-native-*
            artifacts/owned-typography-native-*
            artifacts/files-share-menu
            artifacts/share-destinations
            artifacts/tooltip-lifecycle
            artifacts/settings-poll
            artifacts/clipboard-native-*
            artifacts/search-native-*
            artifacts/search-history-*
            artifacts/force-quit
            artifacts/force-quit-native-*
            artifacts/software-effects-kernel
            artifacts/effects-software-render
            artifacts/owned-preview-*
            artifacts/preview-actions-*
            artifacts/image-markup-*
            artifacts/qt-pointer-retirement-*
            artifacts/files-history-*
            artifacts/batch-rename-*
            artifacts/trash-confirmation-*
            artifacts/files-selection-*
            artifacts/installed-switcher-*
            artifacts/group-membership-*
            artifacts/group-selector-*
            artifacts/window-groups-*
            artifacts/dialog-manager-lifetime-*
            artifacts/desktop-lifecycle-*
            artifacts/widget-visibility*
            artifacts/screen-saver*
            artifacts/calendar-widget*
            artifacts/calendar-card
            artifacts/calendar-window
            artifacts/calendar-popover
            artifacts/input-settings
            artifacts/wallpaper-settings
            artifacts/widget-catalogue-*
            artifacts/shell
            artifacts/interactions
            artifacts/native-layouts
            artifacts/window-controls-*
            artifacts/resize-hit-targets-*
            artifacts/resize-rapid-*
            artifacts/owned-geometry-*
            artifacts/owned-components-*
            artifacts/minimized-dock-*
            artifacts/icon-grid
