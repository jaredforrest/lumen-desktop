name: Checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs --option abort-on-warn true
      - run: nix develop --command nu tests/ci/test_prepare_software_effects.nu
      - run: nix develop --command nu tests/ci/test_run_native.nu
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command gitleaks git . --redact=100
      - run: nix develop --command nu tests/ci/run-native.nu namespace_policy_prepare -- lumen-native-namespace-policy prepare --output artifacts/native-namespace-policy
      - run: nix develop --command nu tests/ci/integration-smoke.nu
      - run: nix develop --command nu tests/ci/integration-effects.nu
      - run: nix develop --command nu tests/ci/integration-native.nu
      - run: nix develop --command nu tests/ci/integration-network.nu
      - if: always()
        run: nix develop --command nu tests/ci/run-native.nu namespace_policy_cleanup -- lumen-native-namespace-policy cleanup --output artifacts/native-namespace-policy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-logs
          if-no-files-found: error
          path: |
            artifacts/native-command-logs
            artifacts/native-namespace-policy
            artifacts/calendar-toggle-contrast
            artifacts/owned-typography-qml
            artifacts/owned-focus-qml
            artifacts/owned-inactive-native-*
            artifacts/reduced-motion-*
            artifacts/live-overlay-appearance-*
            artifacts/semantic-state-*
            artifacts/focus-expiry-presentation
            artifacts/switch-indicator-paint
            artifacts/owned-utility-typography
            artifacts/owned-utility-native-*
            artifacts/shared-control-typography
            artifacts/shared-control-native-*
            artifacts/calendar-detail-typography
            artifacts/calendar-detail-native-*
            artifacts/launcher-typography
            artifacts/document-tabs-typography
            artifacts/overview-typography
            artifacts/overview-typography-native-*
            artifacts/desktop-typography-native-*
            artifacts/launcher-typography-native-*
            artifacts/owned-typography-native-*
            artifacts/files-share-menu
            artifacts/clipboard-native-*
            artifacts/search-native-*
            artifacts/search-history-*
            artifacts/force-quit
            artifacts/force-quit-native-*
            artifacts/software-effects-kernel
            artifacts/effects-software-render
            artifacts/owned-preview-*
            artifacts/preview-actions-*
            artifacts/image-markup-*
            artifacts/qt-pointer-retirement-*
            artifacts/files-history-*
            artifacts/batch-rename-*
            artifacts/trash-confirmation-*
            artifacts/files-selection-*
            artifacts/installed-switcher-*
            artifacts/group-membership-*
            artifacts/group-selector-*
            artifacts/window-groups-*
            artifacts/dialog-manager-lifetime-*
            artifacts/desktop-lifecycle-*
            artifacts/widget-visibility*
            artifacts/screen-saver*
            artifacts/calendar-widget*
            artifacts/calendar-card
            artifacts/calendar-window
            artifacts/calendar-popover
            artifacts/input-settings
            artifacts/wallpaper-settings
            artifacts/widget-catalogue-*
            artifacts/shell
            artifacts/interactions
            artifacts/native-layouts
            artifacts/window-controls-*
            artifacts/resize-hit-targets-*
            artifacts/resize-rapid-*
            artifacts/owned-geometry-*
            artifacts/minimized-dock-*
            artifacts/icon-grid
            artifacts/content-clipping-*
            artifacts/consumer-fit-*
            artifacts/preferred-zoom-*
            artifacts/mixed-output-scale-*
            artifacts/accessibility
            artifacts/screen-reader-input-*
            artifacts/screen-reader-transport
            artifacts/screen-reader-action-metadata
            artifacts/screen-reader-action-metadata-rust
            artifacts/screen-reader-closures
            artifacts/reader-command-provider
            artifacts/application-isolation
            artifacts/capture-protocol
            artifacts/capture-native-*
            artifacts/clock-native-*
            artifacts/settings-search-*
            artifacts/hot-corners
            artifacts/edge-layouts*
            artifacts/paired-layouts
            artifacts/paired-layouts-effects
            artifacts/paired-picker
            artifacts/notification-recovery-*
            artifacts/notification-lock-*
            artifacts/file-drag
            artifacts/files-layout
            artifacts/files-layout-effects
            artifacts/surfaces-*
            artifacts/typography
            artifacts/live-appearance
            artifacts/live-transparency-*
            artifacts/spaces
            artifacts/display-spaces-*
            artifacts/application-desktops-*
            artifacts/network-connectivity-provider
            artifacts/power-provider
            artifacts/overview-lifecycle
            artifacts/window-relationships-*
            artifacts/xwayland-relationships-*
            artifacts/xwayland-no-xres-*
            artifacts/owned-window-context-*
            artifacts/menu-keyboard-*
            artifacts/shortcut-fixtures
            artifacts/shortcut-hints-*
            artifacts/menubar-*
            artifacts/status-clock
            artifacts/portal-permissions
            artifacts/dock-motion-*
            artifacts/dock-calendar-corpus
            artifacts/dock-offer-*
            artifacts/folder-stack-*
            artifacts/dock-drag-out*
            artifacts/fullscreen-menu*
            artifacts/media-controls*
            artifacts/system-popover-reflow*
            artifacts/text-sizing
            artifacts/application-lifecycle
            artifacts/session-end*
            artifacts/network-provider.log

  vault-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: |
          mkdir -p artifacts
          nix build .#test-vault-server -o artifacts/vault-server --option abort-on-warn true
          nix build .#test-vault-web -o artifacts/vault-web --option abort-on-warn true
          nix build .#test-vault-cli -o artifacts/vault-cli --option abort-on-warn true
          nix build .#test-vault-browser -o artifacts/vault-browser --option abort-on-warn true
          nix build .#test-vault-tools -o artifacts/vault-tools --option abort-on-warn true
          nix build .#test-owned-font-config -o artifacts/vault-fonts --option abort-on-warn true
      - run: python3 -W error tests/desktop/test_vault_artifacts.py
      - run: bash tests/ci/run-native.sh vault_namespace_prepare nix develop --command desktop-test-python tests/ci/native_namespace_policy.py prepare --output artifacts/vault-namespace
      - run: bash tests/ci/run-native.sh vault_transport_native nix develop --command desktop-test-python tests/desktop/vault_transport_native.py --tls-tool "$PWD/artifacts/vault-tools/bin/openssl" --output artifacts/vault-transport
      - run: bash tests/ci/run-native.sh vault_compatibility nix develop --command desktop-test-python tests/desktop/disposable_vault.py --server "$PWD/artifacts/vault-server/bin/vaultwarden" --web "$PWD/artifacts/vault-web/share/vaultwarden/vault" --cli "$PWD/artifacts/vault-cli/bin/bw" --browser "$PWD/artifacts/vault-browser/bin/brave" --bus "$PWD/artifacts/vault-tools/bin/dbus-daemon" --tls-tool "$PWD/artifacts/vault-tools/bin/openssl" --trust-tool "$PWD/artifacts/vault-tools/bin/certutil" --font-config "$PWD/artifacts/vault-fonts" --output artifacts/vault-compatibility
      - if: always()
        run: bash tests/ci/run-native.sh vault_namespace_cleanup nix develop --command desktop-test-python tests/ci/native_namespace_policy.py cleanup --output artifacts/vault-namespace
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-compatibility
          path: |
            artifacts/vault-compatibility
            artifacts/vault-transport
            artifacts/vault-namespace
            artifacts/native-command-logs/vault*

  provider-save-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: |
          mkdir -p artifacts
          nix build .#wordcraft --out-link artifacts/wordcraft --option abort-on-warn true
          nix build .#gridcraft --out-link artifacts/gridcraft --option abort-on-warn true
          nix build .#deckcraft --out-link artifacts/deckcraft --option abort-on-warn true
      - run: bash tests/ci/run-native.sh provider_save_namespace_prepare nix develop --command desktop-test-python tests/ci/native_namespace_policy.py prepare --output artifacts/provider-save-namespace
      - run: bash tests/ci/run-native.sh provider_atomic_save nix develop --command desktop-test-python tests/desktop/provider_atomic_save.py --wordcraft "$PWD/artifacts/wordcraft/bin/wordcraft-cli" --gridcraft "$PWD/artifacts/gridcraft/bin/gridcraft-cli" --deckcraft "$PWD/artifacts/deckcraft/bin/deckcraft-cli" --output artifacts/provider-atomic-save
      - run: bash tests/ci/run-native.sh provider_output_formats nix develop --command desktop-test-python tests/desktop/deck_format_truthfulness.py --slides "$PWD/artifacts/deckcraft/bin/deckcraft-cli" --output artifacts/provider-output-formats
      - if: always()
        run: bash tests/ci/run-native.sh provider_save_namespace_cleanup nix develop --command desktop-test-python tests/ci/native_namespace_policy.py cleanup --output artifacts/provider-save-namespace
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-save-integrity
          path: |
            artifacts/provider-save-namespace
            artifacts/provider-atomic-save
            artifacts/provider-output-formats
            artifacts/native-command-logs/provider*
