name: Material hierarchy (manual)
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  material-hierarchy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command nu tests/ci/run-native.nu material_namespace_prepare -- lumen-native-namespace-policy prepare --output artifacts/material-namespace-policy
      - run: nix develop --command nu tests/ci/material-hierarchy.nu
      - if: always()
        run: nix develop --command nu tests/ci/run-native.nu material_namespace_cleanup -- lumen-native-namespace-policy cleanup --output artifacts/material-namespace-policy
      - if: always()
        run: nix develop --command lumen-stage-artifacts . tests/ci/material-artifact-paths.txt artifacts-upload/material-hierarchy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: material-hierarchy
          if-no-files-found: error
          path: artifacts-upload/material-hierarchy
